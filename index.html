<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Islamabad Pets World</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div style="padding:50px; text-align:center;">

    <h1>Islamabad Pets World</h1>

    <p>Premium Parrots & Accessories</p>

    <br><br>

    <form id="checkout-form">

      <input type="text" id="customer-name" placeholder="Your Name" required
        style="padding:12px; width:300px; margin:10px;"><br>

      <input type="text" id="customer-phone" placeholder="Phone Number" required
        style="padding:12px; width:300px; margin:10px;"><br>

      <select id="customer-city" required
        style="padding:12px; width:325px; margin:10px;">

        <option value="">Select City</option>
        <option value="Islamabad">Islamabad</option>
        <option value="Lahore">Lahore</option>
        <option value="Karachi">Karachi</option>
        <option value="Rawalpindi">Rawalpindi</option>

      </select><br>

      <textarea id="customer-address" placeholder="Address" required
        style="padding:12px; width:300px; margin:10px;"></textarea><br>

      <textarea id="customer-notes" placeholder="Order Notes"
        style="padding:12px; width:300px; margin:10px;"></textarea><br>

      <button type="submit"
        style="padding:14px 30px; background:green; color:white; border:none; border-radius:8px; cursor:pointer;">

        Place Order

      </button>

    </form>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBFsH8RBsRhRxbrN2g9MMDkR1b0O1ZxYJI",
      authDomain: "islamabadparrot-285bf.firebaseapp.com",
      projectId: "islamabadparrot-285bf",
      storageBucket: "islamabadparrot-285bf.firebasestorage.app",
      messagingSenderId: "178142021195",
      appId: "1:178142021195:web:e37fd8ae63cdf16fad6fce",
      measurementId: "G-ZV2ZWME6DL"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    // Firestore Database
    const db = getFirestore(app);

    // Save Order
    async function saveOrder(orderData) {

      try {

        await addDoc(collection(db, "orders"), orderData);

        alert("Order Saved Successfully!");

      } catch (error) {

        console.log(error);

        alert("Error Saving Order");

      }

    }

    // Form Submit
    document.getElementById("checkout-form").addEventListener("submit", async function (e) {

      e.preventDefault();

      const orderData = {

        customerName: document.getElementById("customer-name").value,

        customerPhone: document.getElementById("customer-phone").value,

        customerCity: document.getElementById("customer-city").value,

        customerAddress: document.getElementById("customer-address").value,

        customerNotes: document.getElementById("customer-notes").value,

        orderTime: new Date()

      };

      await saveOrder(orderData);

      document.getElementById("checkout-form").reset();

    });

  </script>

</body>

</html>
